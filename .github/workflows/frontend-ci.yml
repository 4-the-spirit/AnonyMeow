name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
  push:
    branches: [master]
    paths:
      - "frontend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      # Build-only smoke check with whatever VITE_* defaults npm run build falls back to.
      # The real production build (with real VITE_B2C_*/VITE_API_BASE_URL values) happens
      # in the Static Web Apps deploy workflow, not here.
      - name: Build
        working-directory: frontend
        run: npm run build
