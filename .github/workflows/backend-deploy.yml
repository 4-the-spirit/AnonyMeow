name: Backend Deploy (Production)

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "infra/**"
  workflow_dispatch: {}

permissions:
  id-token: write # required for azure/login OIDC federated credential
  contents: read

# Serializes deploy runs so two pushes in quick succession (or a manual re-run) can never run
# `dotnet ef database update` against the live database concurrently. Queues rather than
# cancels in-progress — an interrupted migration/deploy mid-flight is worse than a short wait.
concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore "AnonyMeow.sln"

      - name: Build
        working-directory: backend
        run: dotnet build "AnonyMeow.sln" --no-restore -c Release

      - name: Test
        working-directory: backend
        run: dotnet test "AnonyMeow.sln" --no-build -c Release

  # Gated behind the "production" GitHub Environment's required reviewers (configure this
  # in repo Settings -> Environments) — the human approval here is what satisfies
  # CLAUDE.md's "migrations reviewed for destructive operations before applying" for the
  # one step in ongoing CI/CD that mutates the live database.
  migrate-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core CLI tool
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        working-directory: backend
        run: dotnet restore "AnonyMeow.sln"

      - name: Apply database migrations
        working-directory: backend
        run: >
          dotnet ef database update
          --project "AnonyMeow.csproj"
          --connection "${{ secrets.PROD_DB_CONNECTION_STRING }}"

      - name: Publish
        working-directory: backend
        run: dotnet publish "AnonyMeow.csproj" -c Release -o publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          package: backend/publish
